name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python "${UV_PYTHON}"

      - name: Run tests and lint
        run: make check PYTHON="uv run --frozen --extra dev python"

      - name: Install pyright
        run: uv tool install pyright==1.1.411

      - name: Run Python type gate
        run: make typecheck

      - name: Run coverage gate
        run: make coverage

      - name: Build distributions
        env:
          OOXML_BUILD_OUTPUT: ${{ runner.temp }}/ooxml-client-dist
        run: make build PYTHON="uv run --frozen --extra dev python"
