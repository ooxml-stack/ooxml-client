name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python "${UV_PYTHON}"

      - name: Run tests and lint
        run: make check PYTHON="uv run --frozen --extra dev python"

      - name: Install pyright
        run: uv tool install pyright==1.1.411

      - name: Run Python type gate
        run: make typecheck

      - name: Run coverage gate
        run: make coverage

      - name: Build distributions
        env:
          OOXML_BUILD_OUTPUT: ${{ runner.temp }}/ooxml-client-dist
        run: make build PYTHON="uv run --frozen --extra dev python"
