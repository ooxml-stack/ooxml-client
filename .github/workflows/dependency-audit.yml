name: dependency-audit

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36  # v2.7.0
    with:
      scan-args: |-
        -L uv.lock
      upload-sarif: false
      fail-on-vuln: true
