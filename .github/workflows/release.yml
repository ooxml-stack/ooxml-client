name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Build distributions
        run: uv build --out-dir "$RUNNER_TEMP/dist"
      - name: Verify fresh wheel import
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/verify"
          uv pip install --python "$RUNNER_TEMP/verify/bin/python" "$RUNNER_TEMP"/dist/*.whl
          "$RUNNER_TEMP/verify/bin/python" -c "import ooxml_client; print(ooxml_client.__version__)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ooxml-client-dist
          path: ${{ runner.temp }}/dist
