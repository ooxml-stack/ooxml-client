name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Build distributions
        run: uv build --out-dir "$RUNNER_TEMP/dist"
      - name: Verify fresh wheel import
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/verify"
          uv pip install --python "$RUNNER_TEMP/verify/bin/python" "$RUNNER_TEMP"/dist/*.whl
          "$RUNNER_TEMP/verify/bin/python" -c "import ooxml_client; print(ooxml_client.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ooxml-client-dist
          path: ${{ runner.temp }}/dist
