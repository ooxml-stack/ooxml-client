name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Build distributions
        run: uv build --out-dir "$RUNNER_TEMP/dist"
      - name: Verify fresh wheel import
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/verify"
          uv pip install --python "$RUNNER_TEMP/verify/bin/python" "$RUNNER_TEMP"/dist/*.whl
          "$RUNNER_TEMP/verify/bin/python" -c "import ooxml_client; print(ooxml_client.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: ooxml-client-dist
          path: ${{ runner.temp }}/dist
