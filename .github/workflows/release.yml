name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      - name: Build distributions
        run: uv build --out-dir "$RUNNER_TEMP/dist"
      - name: Verify fresh wheel import
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/verify"
          uv pip install --python "$RUNNER_TEMP/verify/bin/python" "$RUNNER_TEMP"/dist/*.whl
          "$RUNNER_TEMP/verify/bin/python" -c "import ooxml_client; print(ooxml_client.__version__)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ooxml-client-dist
          path: ${{ runner.temp }}/dist
